interface system0 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            admin-state enable
            address 10.0.0.2/32 {
            }
        }
    }
}
system {
    network-instance {
        protocols {
            evpn {
                ethernet-segments {
                    bgp-instance 1 {
                        ethernet-segment ES-1 {
                            type virtual
                            admin-state enable
                            esi 04:01:01:01:01:00:00:00:00:00
                            multi-homing-mode single-active
                            next-hop 1.1.1.1 {
                                evi 1 {
                                }
                            }
                            df-election {
                                algorithm {
                                    type manual
                                    manual-alg {
                                        primary-evi-range 1 {
                                            end-evi 1
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
            bgp-vpn {
                bgp-instance 1 {
                }
            }
        }
    }
}
network-instance default {
    type default
    admin-state enable
    interface ethernet-1/31.0 {
    }
    interface ethernet-1/32.0 {
    }
    interface system0.0 {
    }
    protocols {
        bgp {
            autonomous-system 102
            router-id 10.0.0.2
            afi-safi ipv4-unicast {
                admin-state enable
            }
            group eBGP-underlay {
                peer-as 201
                export-policy [
                    all
                ]
                import-policy [
                    all
                ]
            }
            group iBGP-overlay {
                peer-as 100
                export-policy [
                    all
                ]
                import-policy [
                    all
                ]
                afi-safi evpn {
                    admin-state enable
                }
                afi-safi ipv4-unicast {
                    admin-state disable
                }
                local-as {
                    as-number 100
                }
                timers {
                    minimum-advertisement-interval 1
                }
            }
            neighbor 10.0.0.5 {
                peer-group iBGP-overlay
            }
            neighbor 10.0.0.6 {
                peer-group iBGP-overlay
            }
            neighbor 100.64.0.2 {
                peer-group eBGP-underlay
            }
            neighbor 100.64.0.10 {
                peer-group eBGP-underlay
            }
        }
    }
}
network-instance ipvrf1 {
    type ip-vrf
    admin-state enable
    interface ethernet-1/2.0 {
    }
    vxlan-interface vxlan1.1 {
    }
    protocols {
        bgp-evpn {
            bgp-instance 1 {
                admin-state enable
                vxlan-interface vxlan1.1
                evi 1
                ecmp 2
            }
        }
        bgp-vpn {
            bgp-instance 1 {
                route-target {
                    export-rt target:100:1
                    import-rt target:100:1
                }
            }
        }
    }
    static-routes {
        admin-state enable
        route 1.1.1.1/32 {
            admin-state enable
            next-hop-group ce1
        }
    }
    next-hop-groups {
        group ce1 {
            admin-state enable
            nexthop 0 {
                ip-address 192.168.2.1
                admin-state enable
            }
        }
    }
}
routing-policy {
    policy all {
        default-action {
            policy-result accept
        }
    }
}
tunnel-interface vxlan1 {
    vxlan-interface 1 {
        type routed
        ingress {
            vni 1
        }
    }
}
