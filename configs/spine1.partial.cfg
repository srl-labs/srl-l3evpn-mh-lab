interface lo0 {
    admin-state enable
    subinterface 0 {
        admin-state enable
        ipv4 {
            admin-state enable
            address 10.10.10.1/32 {
            }
        }
    }
}
interface system0 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            admin-state enable
            address 10.0.0.5/32 {
            }
        }
    }
}
system {
    network-instance {
        protocols {
            evpn {
                ethernet-segments {
                    bgp-instance 1 {
                        ethernet-segment ES-1 {
                            type virtual
                            admin-state enable
                            esi 04:01:01:01:01:00:00:00:00:00
                            multi-homing-mode single-active
                            next-hop 1.1.1.1 {
                                evi 1 {
                                }
                            }
                            df-election {
                                algorithm {
                                    type manual
                                }
                            }
                        }
                        ethernet-segment ES-2 {
                            type virtual
                            admin-state enable
                            esi 04:02:02:02:02:00:00:00:00:00
                            multi-homing-mode single-active
                            next-hop 2.2.2.2 {
                                evi 1 {
                                }
                            }
                            df-election {
                                algorithm {
                                    type manual
                                }
                            }
                        }
                    }
                }
            }
            bgp-vpn {
                bgp-instance 1 {
                }
            }
        }
    }
}
network-instance default {
    type default
    admin-state enable
    interface ethernet-1/1.0 {
    }
    interface ethernet-1/2.0 {
    }
    interface ethernet-1/3.0 {
    }
    interface ethernet-1/4.0 {
    }
    interface system0.0 {
    }
    protocols {
        bgp {
            autonomous-system 201
            router-id 10.0.0.5
            afi-safi ipv4-unicast {
                admin-state enable
            }
            route-reflector {
                client true
                cluster-id 10.0.0.5
            }
            group eBGP-underlay {
                export-policy [
                    all
                ]
                import-policy [
                    all
                ]
            }
            group iBGP-overlay {
                peer-as 100
                export-policy [
                    all
                ]
                import-policy [
                    all
                ]
                afi-safi evpn {
                    admin-state enable
                }
                afi-safi ipv4-unicast {
                    admin-state disable
                }
                local-as {
                    as-number 100
                }
                timers {
                    minimum-advertisement-interval 1
                }
            }
            neighbor 10.0.0.1 {
                peer-group iBGP-overlay
            }
            neighbor 10.0.0.2 {
                peer-group iBGP-overlay
            }
            neighbor 10.0.0.3 {
                peer-group iBGP-overlay
            }
            neighbor 10.0.0.4 {
                peer-group iBGP-overlay
            }
            neighbor 10.0.0.6 {
                peer-group iBGP-overlay
            }
            neighbor 100.64.0.1 {
                peer-as 101
                peer-group eBGP-underlay
            }
            neighbor 100.64.0.3 {
                peer-as 102
                peer-group eBGP-underlay
            }
            neighbor 100.64.0.5 {
                peer-as 103
                peer-group eBGP-underlay
            }
            neighbor 100.64.0.7 {
                peer-as 104
                peer-group eBGP-underlay
            }
        }
    }
}
network-instance ipvrf1 {
    type ip-vrf
    admin-state enable
    interface lo0.0 {
    }
    vxlan-interface vxlan1.1 {
    }
    protocols {
        bgp-evpn {
            bgp-instance 1 {
                admin-state enable
                vxlan-interface vxlan1.1
                evi 1
                ecmp 2
            }
        }
        bgp {
            autonomous-system 64500
            router-id 10.10.10.1
            afi-safi ipv4-unicast {
                admin-state enable
            }
            group PE-CE {
                export-policy [
                    all
                ]
                import-policy [
                    all
                ]
            }
            neighbor 1.1.1.1 {
                peer-as 64501
                peer-group PE-CE
                multihop {
                    admin-state enable
                    maximum-hops 10
                }
                transport {
                    local-address 10.10.10.1
                }
            }
            neighbor 2.2.2.2 {
                peer-as 64502
                peer-group PE-CE
                multihop {
                    admin-state enable
                    maximum-hops 10
                }
                transport {
                    local-address 10.10.10.1
                }
            }
        }
        bgp-vpn {
            bgp-instance 1 {
                route-target {
                    export-rt target:100:1
                    import-rt target:100:1
                }
            }
        }
    }
}
routing-policy {
    policy all {
        default-action {
            policy-result accept
        }
    }
}
tunnel-interface vxlan1 {
    vxlan-interface 1 {
        type routed
        ingress {
            vni 1
        }
    }
}
