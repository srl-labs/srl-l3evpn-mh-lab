interface lo0 {
    admin-state enable
    subinterface 0 {
        admin-state enable
        ipv4 {
            admin-state enable
            address 1.1.1.1/32 {
            }
        }
    }
    subinterface 1 {
        admin-state enable
        ipv4 {
            admin-state enable
            address 100.100.100.1/32 {
            }
        }
    }
}
network-instance default {
    type default
    admin-state enable
    interface ethernet-1/1.0 {
    }
    interface ethernet-1/2.0 {
    }
    interface lo0.0 {
    }
    interface lo0.1 {
    }
    protocols {
        bgp {
            autonomous-system 64501
            router-id 1.1.1.1
            afi-safi ipv4-unicast {
                admin-state enable
                multipath {
                    maximum-paths 2
                }
            }
            group PE-CE {
                peer-as 64500
                export-policy [
                    export_loopback
                ]
                import-policy [
                    all
                ]
            }
            neighbor 10.10.10.1 {
                peer-group PE-CE
                multihop {
                    admin-state enable
                    maximum-hops 10
                }
                transport {
                    local-address 1.1.1.1
                }
            }
            neighbor 10.10.10.2 {
                peer-group PE-CE
                multihop {
                    admin-state enable
                    maximum-hops 10
                }
                transport {
                    local-address 1.1.1.1
                }
            }
        }
    }
    static-routes {
        admin-state enable
        route 10.10.10.1/32 {
            admin-state enable
            next-hop-group ipvrf1
        }
        route 10.10.10.2/32 {
            admin-state enable
            next-hop-group ipvrf1
        }
    }
    next-hop-groups {
        group ipvrf1 {
            admin-state enable
            nexthop 0 {
                ip-address 192.168.1.0
                admin-state enable
            }
            nexthop 1 {
                ip-address 192.168.2.0
                admin-state enable
            }
        }
    }
}
routing-policy {
    prefix-set loopback {
        prefix 100.100.100.1/32 mask-length-range exact {
        }
    }
    policy all {
        default-action {
            policy-result accept
        }
    }
    policy export_loopback {
        default-action {
            policy-result reject
        }
        statement 10 {
            match {
                prefix-set loopback
            }
            action {
                policy-result accept
            }
        }
    }
}
